<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c182b"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13233a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#091322" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Glowing Orbs -->
  <circle cx="1100" cy="100" r="250" fill="#00f0ff" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="550" r="300" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Grid lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Brand Header -->
  <g transform="translate(80, 80)">
    <!-- Logo Icon -->
    <rect width="56" height="56" rx="16" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <circle cx="28" cy="28" r="14" stroke="#070b14" stroke-width="4" fill="none"/>
    <line x1="28" y1="8" x2="28" y2="48" stroke="#070b14" stroke-width="4"/>
    <line x1="8" y1="28" x2="48" y2="28" stroke="#070b14" stroke-width="4"/>

    <!-- Brand Name -->
    <text x="74" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-1">ApexScout</text>
    <rect x="250" y="16" width="105" height="26" rx="6" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="264" y="34" font-family="monospace" font-size="12" font-weight="800" fill="#00f0ff" letter-spacing="1">ENTERPRISE</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    The Intelligence Platform for
  </text>
  <text x="80" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#cyanGrad)" letter-spacing="-1.5">
    NHL Ops &amp; NCAA D1 Recruiting.
  </text>

  <text x="80" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Hands-Free Voice AI ? Live Draft Floor Trade Machine ? 2026 NIL Cap Optimizer ? VisionLab? Biomechanics
  </text>

  <!-- 3 Interactive Feature Preview Cards -->
  <g transform="translate(80, 380)">
    <!-- Card 1: RinkMic & Live Draft -->
    <rect x="0" y="0" width="320" height="170" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#0284c7" fill-opacity="0.3"/>
    <text x="30" y="40" font-family="system-ui" font-size="16" fill="#38bdf8">???</text>
    <text x="65" y="40" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">RinkMic? Voice AI</text>
    <text x="25" y="75" font-family="system-ui" font-size="13" fill="#cbd5e1">Hands-free AirPods dictation</text>
    <text x="25" y="95" font-family="system-ui" font-size="13" fill="#cbd5e1">with NLP shift auto-tagging &amp;</text>
    <text x="25" y="115" font-family="system-ui" font-size="13" fill="#cbd5e1">1-click scouting report compiler.</text>
    <rect x="25" y="130" width="130" height="22" rx="6" fill="#0284c7" fill-opacity="0.2"/>
    <text x="35" y="145" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8">30?F IN-RINK TESTED</text>
  </g>

  <g transform="translate(440, 380)">
    <!-- Card 2: 2026 Rev-Share & NIL -->
    <rect x="0" y="0" width="320" height="170" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#059669" fill-opacity="0.3"/>
    <text x="30" y="40" font-family="system-ui" font-size="16" fill="#34d399">??</text>
    <text x="65" y="40" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">2026 Rev-Share Hub</text>
    <text x="25" y="75" font-family="system-ui" font-size="13" fill="#cbd5e1">House v. NCAA Settlement Guard:</text>
    <text x="25" y="95" font-family="system-ui" font-size="13" fill="#cbd5e1">26-man active roster cap with</text>
    <text x="25" y="115" font-family="system-ui" font-size="13" fill="#cbd5e1">$3.2M pool + Portal ROI simulator.</text>
    <rect x="25" y="130" width="140" height="22" rx="6" fill="#059669" fill-opacity="0.2"/>
    <text x="35" y="145" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">26-MAN HARD CAP</text>
  </g>

  <g transform="translate(800, 380)">
    <!-- Card 3: VisionLab Biomechanics -->
    <rect x="0" y="0" width="320" height="170" rx="18" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#7e22ce" fill-opacity="0.3"/>
    <text x="30" y="40" font-family="system-ui" font-size="16" fill="#c084fc">??</text>
    <text x="65" y="40" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff">VisionLab? Stride Lab</text>
    <text x="25" y="75" font-family="system-ui" font-size="13" fill="#cbd5e1">2D animated skeletal tracker,</text>
    <text x="25" y="95" font-family="system-ui" font-size="13" fill="#cbd5e1">0-15 MPH burst radar, and McDavid</text>
    <text x="25" y="115" font-family="system-ui" font-size="13" fill="#cbd5e1">gold-standard stride benchmarking.</text>
    <rect x="25" y="130" width="135" height="22" rx="6" fill="#7e22ce" fill-opacity="0.2"/>
    <text x="35" y="145" font-family="monospace" font-size="10" font-weight="700" fill="#c084fc">60 FPS KINEMATICS</text>
  </g>

  <!-- Live Status Pill in Top Right -->
  <g transform="translate(930, 80)">
    <rect width="190" height="42" rx="21" fill="#091322" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#34d399"/>
    <text x="38" y="26" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">100% ENCRYPTED PRO</text>
  </g>
</svg>
